[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "bearingdx"
description = "Vibration-based bearing fault diagnosis using CWRU dataset"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "BearingDX Development Team", email = "bearingdx@example.com"}
]
maintainers = [
    {name = "BearingDX Development Team", email = "bearingdx@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research", 
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "bearing",
    "fault diagnosis",
    "vibration analysis", 
    "condition monitoring",
    "predictive maintenance",
    "signal processing",
    "CWRU dataset",
    "envelope analysis",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "PyYAML>=6.0",
    "click>=8.0.0",
    "tqdm>=4.60.0",
    "rich>=10.0.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=3.0.0",
    "pytest-mock>=3.6.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "isort>=5.0.0",
    "mypy>=0.910",
    "pre-commit>=2.15.0",
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
]
performance = [
    "numba>=0.56.0",
    "joblib>=1.1.0",
]
advanced = [
    "pywavelets>=1.1.1",
    "librosa>=0.8.1",
]
all = [
    "bearingdx[dev,docs,notebooks,performance,advanced]"
]

[project.scripts]
bearingdx = "bearingdx.cli.dx:main"
bdx = "bearingdx.cli.dx:main"

[project.urls]
Homepage = "https://github.com/bearingdx/bearingdx"
Repository = "https://github.com/bearingdx/bearingdx"
Documentation = "https://bearingdx.readthedocs.io/"
"Bug Reports" = "https://github.com/bearingdx/bearingdx/issues"
Changelog = "https://github.com/bearingdx/bearingdx/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["bearingdx*"]
exclude = ["tests*", "docs*", "notebooks*"]

[tool.setuptools.package-data]
bearingdx = ["config/*.yaml", "config/*.json"]

[tool.setuptools_scm]
write_to = "bearingdx/_version.py"

# Black configuration
[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # Directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["bearingdx"]
known_third_party = ["numpy", "scipy", "pandas", "sklearn", "matplotlib", "yaml"]

# MyPy configuration
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "sklearn.*",
    "matplotlib.*",
    "seaborn.*",
    "tqdm.*",
    "rich.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=bearingdx",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "golden: marks tests as golden reference tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["bearingdx"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "setup.py",
    "bearingdx/_version.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
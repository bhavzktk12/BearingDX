# Bearing geometry calculation formulas and constants
formulas:
  description: "Standard bearing fault frequency calculation formulas"
  
  # Fault frequency formulas (for reference)
  bpfi_formula: "BPFI = (Z/2) * (1 + (Bd/Pd) * cos(θ)) * (RPM/60)"
  bpfo_formula: "BPFO = (Z/2) * (1 - (Bd/Pd) * cos(θ)) * (RPM/60)"
  bsf_formula: "BSF = (Pd/2*Bd) * (1 - (Bd/Pd)² * cos²(θ)) * (RPM/60)"
  ftf_formula: "FTF = (1/2) * (1 - (Bd/Pd) * cos(θ)) * (RPM/60)"
  
  # Constants and notes
  constants:
    Z: "Number of rolling elements (balls or rollers)"
    Bd: "Ball or roller diameter"  
    Pd: "Pitch diameter (center-to-center distance of rolling elements)"
    theta: "Contact angle in degrees"
    RPM: "Shaft rotational speed in revolutions per minute"
    
  notes:
    - "All diameters should be in consistent units (mm recommended)"
    - "Contact angle is 0° for radial bearings, typically 15-40° for angular contact"
    - "For roller bearings, use effective roller diameter"
    - "Formulas assume no slip between rolling elements and races"

# Validation rules for bearing geometry
validation:
  rolling_elements:
    min: 3
    max: 50
    typical_range: [6, 20]
    
  ball_diameter_mm:
    min: 1.0
    max: 50.0
    
  pitch_diameter_mm: 
    min: 5.0
    max: 500.0
    
  contact_angle_deg:
    min: 0.0
    max: 45.0
    
  # Consistency checks
  geometric_constraints:
    - "ball_diameter_mm < pitch_diameter_mm"
    - "rolling_elements >= 3"
    - "contact_angle_deg >= 0 and contact_angle_deg <= 45"

